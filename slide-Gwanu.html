<html>
	<head>
		<style>
			body
			{
				background-color:coral;
			}
			#div1
			{
				height:20%;
				background-color:magenta;
				font-size:5em;
				color:darkblue;
				display:flex;
				justify-content:center;
				align-items:center;
			}
			#div2
			{
				height:60%;
				background-color:lime;
				text-align:center;
			}
			#div3
			{
				height:18%;
				background-color:magenta;
				font-size:2.5em;
				color:darkblue;
				text-align:center;
				justify-content:center;
				align-items:center;
			}
			#txt1
			{
				width:50%;
				font-size:3em;
				background-color:crimson;
				color:khaki;
				text-align:center;
			}
			#sd1
			{
				width:50%
			}
			
		</style>
		<script>
			function slide()
			{
				document.getElementById('txt1').value = document.getElementById('sd1').value;		
			}
		</script>
	</head>
	<body>
		<div id='div1'> 슬라이드 제어 </div>
		<div id='div2'>
			<br><br><br>
			<br><br><br>
			<input type='text' id='txt1'>
			<br><br><br>
			<br><br><br>
			<input type='range' id = 'sd1' oninput='slide();' min '0' max = '10000'>
		</div>
		<div id='div3'> 한국폴리텍대학 <br> 메카트로닉스 <br> 김 관 후 </div>
	</body>

</html>
